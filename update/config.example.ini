# /etc/dash-update/config.ini  (läses av dash-update; bara [update] används)
[update]
# Var versionerna hämtas ifrån. Publikt repo över https: ingen nyckel behövs.
# (Ett privat repo går också: git@github.com:<konto>/<repo>.git och en deploy key, se update/README.md.)
repo_url = https://github.com/blobba79/simple_ha_dash.git
# Grenen som installeras och uppdateras från.
ref = main
# yes = timern installerar nya versioner själv; no = den bara kollar (standard)
auto_apply = no
# Så länge tjänsten ska vara uppe och oförändrad innan en uppdatering räknas som lyckad
health_seconds = 40
# Grenen som knappen Uppdatera spel (spelväljaren på panelen) hämtar mappen games/ ifrån (standard main).
# games_ref = main
